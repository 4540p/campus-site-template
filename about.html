<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#1e40af">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">

<body data-page="about">

        <div class="page-hero-orb page-hero-orb-2"></div>

          <div class="page-hero-badge"><span class="page-hero-badge-dot"></span><span data-page-badge></span></div>

          <p class="page-hero-subtitle" data-page-subtitle></p>
          <p class="page-hero-desc" data-page-desc></p>
        </div>
      </div>
    </section>

    <section class="stats-section">
      <div class="container"><div class="stats-grid stats-grid-4" id="about-stats"></div></div>
    </section>

    <section class="about-detail">
      <div class="container">
        <div class="section-header" data-section="about"></div>
        <div class="about-detail-grid">
          <div class="about-detail-main">
            <div id="about-detail-body"></div>
            <div id="about-values" class="about-values"></div>

                <li><span class="contact-icon">📍</span><div><strong>学校地址</strong><p data-site-address></p></div></li>
                <li><span class="contact-icon">📞</span><div><strong>联系电话</strong><p data-site-phone></p></div></li>
                <li><span class="contact-icon">✉️</span><div><strong>邮箱</strong><p data-site-email></p></div></li>
              </ul>
              <a href="mailbox.html" class="hero-btn hero-btn-primary" style="width:100%;justify-content:center;margin-top:20px;"><span>校长信箱</span></a>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <section class="motto-section">
      <div class="motto-bg">
        <div class="motto-orb motto-orb-1"></div>
        <div class="motto-orb motto-orb-2"></div>
      </div>

          <div class="motto-tag">SCHOOL MOTTO</div>
          <h2 class="motto-text" id="motto-title"></h2>
          <p class="motto-en" data-site-slogan-en></p>

        </div>
      </div>
