<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学子风采 - 青禾中学</title>
  <meta name="description" content="青禾中学学生在竞赛、社团与志愿服务中的成长故事。">
  <meta name="theme-color" content="#1e40af">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/faq.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body data-page="students">
  <a href="#main" class="skip-link">跳到主要内容</a>
  <div data-site-header></div>
  <main id="main" role="main">
    <section class="page-hero page-hero-short">
      <div class="page-hero-bg">
        <div class="page-hero-orb page-hero-orb-1"></div>
        <div class="page-hero-orb page-hero-orb-2"></div>
      </div>
      <div class="container">
        <div class="page-hero-content">
          <div class="page-hero-badge"><span class="page-hero-badge-dot"></span><span data-page-badge></span></div>
          <h1 data-page-title></h1>
          <p class="page-hero-subtitle" data-page-subtitle></p>
          <p class="page-hero-desc" data-page-desc></p>
        </div>
      </div>
    </section>

    <section class="stats-section">
      <div class="container"><div class="stats-grid stats-grid-4" id="students-stats"></div></div>
    </section>

    <section class="students">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Our Students</span>
          <h2>优秀学子<span class="accent">展示</span></h2>
          <p class="section-subtitle">他们用行动诠释青春 · 用成绩书写未来</p>
        </div>
        <div class="category-tabs">
          <button class="category-tab active" data-category="all" type="button"><span>全部</span></button>
          <button class="category-tab" data-category="competition" type="button"><span>🏆 竞赛获奖</span></button>
          <button class="category-tab" data-category="club" type="button"><span>🎭 社团活动</span></button>
          <button class="category-tab" data-category="volunteer" type="button"><span>❤️ 志愿公益</span></button>
        </div>
        <div class="students-grid" id="students-grid"></div>
      </div>
    </section>

    <section class="clubs-section">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Student Clubs</span>
          <h2>学生<span class="accent">社团</span></h2>
          <p class="section-subtitle">20+ 精品社团 · 培育兴趣 · 发展特长</p>
        </div>
        <div class="clubs-grid" id="clubs-grid"></div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <div data-site-modals></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/mailbox.js"></script>
  <script src="assets/js/chat.js"></script>

</html>
