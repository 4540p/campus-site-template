<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青禾中学 · 向光生长，逐梦而行</title>
  <meta name="description" content="青禾中学官方网站模板：学校简介、新闻动态、公告通知、师资力量、校园风光、学子风采、招生信息与校长信箱。">
  <meta name="theme-color" content="#1e40af">
  <meta property="og:type" content="website">
  <meta property="og:title" content="青禾中学 · 向光生长，逐梦而行">
  <meta property="og:description" content="一所以学生成长为中心的现代学校。">
  <meta property="og:image" content="assets/img/og-cover.png">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/faq.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="home-page" data-page="home">
  <a href="#main" class="skip-link">跳到主要内容</a>
  <div data-site-header></div>

  <main id="main" role="main">
    <section class="hero" aria-label="主横幅">
      <div class="hero-bg">
        <div class="hero-bg-image"></div>
        <div class="hero-bg-gradient"></div>
        <div class="hero-bg-grid"></div>
        <div class="hero-bg-orb hero-bg-orb-1"></div>
        <div class="hero-bg-orb hero-bg-orb-2"></div>
        <div class="hero-bg-orb hero-bg-orb-3"></div>
      </div>

      <div class="hero-stats" id="hero-stats"></div>

      <div class="hero-content">
        <div class="hero-badge">
          <span class="hero-badge-dot"></span>
          <span id="hero-badge-text"></span>
        </div>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-subtitle-en" id="hero-subtitle-en"></p>
        <p class="hero-subtitle-cn" id="hero-subtitle-cn"></p>
        <div class="hero-actions" id="hero-actions"></div>
      </div>

      <a href="#about" class="hero-scroll" aria-label="向下滚动">
        <span class="hero-scroll-text">SCROLL</span>
        <span class="hero-scroll-line"><span class="hero-scroll-dot"></span></span>
      </a>
      <div class="hero-deco hero-deco-tl"></div>
      <div class="hero-deco hero-deco-br"></div>
    </section>

    <section class="about" id="about">
      <div class="container">
        <div class="section-header" data-section="about"></div>
        <div class="about-content">
          <div class="about-text" id="home-about-text"></div>
          <div class="about-image" id="home-about-image"></div>
        </div>
      </div>
    </section>

    <section class="features">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Our Features</span>
          <h2>办学<span class="accent">特色</span></h2>
          <p class="section-subtitle">关注每一个孩子的成长节奏</p>
        </div>
        <div class="features-grid" id="features-grid"></div>
      </div>
    </section>

    <section class="news">
      <div class="container">
        <div class="section-header" data-section="sections.news"></div>
        <div class="news-grid" id="home-news-grid"></div>
        <div class="news-more">
          <a href="news.html" class="hero-btn hero-btn-outline"><span>查看更多资讯</span></a>
        </div>
      </div>
    </section>

    <section class="gallery">
      <div class="container">
        <div class="section-header" data-section="sections.gallery"></div>
        <div class="gallery-grid-modern" id="home-gallery-grid"></div>
      </div>
    </section>

    <section class="countdown">
      <div class="countdown-bg">
        <div class="countdown-orb countdown-orb-1"></div>
        <div class="countdown-orb countdown-orb-2"></div>
      </div>
      <div class="container" style="position:relative;z-index:2;">
        <div class="section-header">
          <span class="section-tag" style="background:rgba(255,255,255,.15);color:#fff;">Important Dates</span>
          <h2 style="color:#fff;">重要日程<span style="color:var(--accent-light);">倒计时</span></h2>
          <p class="section-subtitle" style="color:rgba(255,255,255,.8);">把握每一刻 · 奋斗正当时</p>
        </div>
        <div class="countdown-grid" id="countdown-grid"></div>
      </div>
    </section>

    <section class="home-announcements">
      <div class="container">
        <div class="section-header" data-section="sections.announcements"></div>
        <div id="home-announce-list" class="home-announce-list"></div>
        <div class="home-announce-more">
          <a href="announcements.html" class="hero-btn hero-btn-secondary"><span>查看全部公告 →</span></a>
        </div>
      </div>
    </section>

    <section class="mailbox-check">
      <div class="container">
        <div class="section-header" data-section="sections.mailbox"></div>
        <div class="check-form">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="check-form-icon" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
          </svg>
          <input type="text" id="query-code" placeholder="请输入查询码（如：AB23CD45）" aria-label="查询码">
          <button id="check-btn" class="btn" type="button">查询</button>
        </div>
        <div id="check-result"></div>
      </div>
    </section>

    <section class="faq-tool-section" aria-label="校务问答">
      <div class="container">
        <div class="section-header" data-section="sections.faq"></div>
        <div class="faq-tool-grid">
          <div class="faq-tool-card">
            <div class="faq-tool-icon" aria-hidden="true">🔍</div>
            <h3>直接提问</h3>
            <p>支持“几点上课”“什么时候报名”等口语化问法，自动匹配最相关答案。</p>
            <button type="button" class="faq-tool-entry" onclick="openFAQ()">
              <span class="faq-tool-entry-icon" aria-hidden="true">💬</span><span>立即提问</span>
            </button>
          </div>
          <div class="faq-tool-card">
            <div class="faq-tool-icon" aria-hidden="true">📚</div>
            <h3>浏览全部</h3>
            <p>按分类浏览常见问题，支持关键词筛选。</p>
            <button type="button" class="faq-tool-entry" onclick="openFAQ()">
              <span class="faq-tool-entry-icon" aria-hidden="true">📖</span><span>浏览全部</span>
            </button>
          </div>
          <div class="faq-tool-card">
            <div class="faq-tool-icon" aria-hidden="true">🛡️</div>
            <h3>离线可用</h3>
            <p>不依赖大模型，读取本地 JSON 即可回答，部署成本低。</p>
            <button type="button" class="faq-tool-entry" onclick="openFAQ()">
              <span class="faq-tool-entry-icon" aria-hidden="true">⚡</span><span>试试效果</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="public-replies" id="public-replies-section">
      <div class="container">
        <div class="section-header" data-section="sections.replies"></div>
        <div id="public-replies-grid" class="public-replies-grid"></div>
      </div>
    </section>

    <section class="friendly-links">
      <div class="container">
        <div class="section-header" data-section="sections.links"></div>
        <div class="links-grid" id="links-grid"></div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <div data-site-modals></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/mailbox.js"></script>
  <script src="assets/js/chat.js"></script>
</body>
</html>
