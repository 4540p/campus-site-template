<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招生简章 - 青禾中学</title>
  <meta name="description" content="查看青禾中学最新招生简章、招生计划与报名流程。">
  <meta name="theme-color" content="#1e40af">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/faq.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body data-page="admission">
  <a href="#main" class="skip-link">跳到主要内容</a>
  <div data-site-header></div>
  <main id="main" role="main">
    <section class="page-hero page-hero-short">
      <div class="page-hero-bg">
        <div class="page-hero-orb page-hero-orb-1"></div>
        <div class="page-hero-orb page-hero-orb-2"></div>
      </div>
      <div class="container">
        <div class="page-hero-content">
          <div class="page-hero-badge"><span class="page-hero-badge-dot"></span><span data-page-badge></span></div>
          <h1 data-page-title></h1>
          <p class="page-hero-subtitle" data-page-subtitle></p>
          <p class="page-hero-desc" data-page-desc></p>
        </div>
      </div>
    </section>

    <section class="stats-section">
      <div class="container"><div class="stats-grid stats-grid-4" id="admission-stats"></div></div>
    </section>

    <section class="admission">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Prospectus</span>
          <h2>招生<span class="accent">简章</span></h2>
          <p class="section-subtitle">下载最新简章 · 了解招生政策</p>
        </div>
        <div class="admission-grid">
          <div class="admission-main">
            <div class="recruitment-search" role="search">
              <label for="recruitment-search-input" class="recruitment-search-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                搜索招生简章
              </label>
              <div class="recruitment-search-input-wrap">
                <input type="search" id="recruitment-search-input" class="recruitment-search-input" placeholder="关键词搜索：例如 2026、奖学金、报名…" aria-label="搜索招生简章" maxlength="80" autocomplete="off">
                <button type="button" id="recruitment-search-clear" class="recruitment-search-clear" aria-label="清除搜索">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
              <div class="recruitment-search-meta" id="recruitment-search-meta"></div>
            </div>
            <div id="recruitment-list" class="recruitment-list"></div>
          </div>
          <aside class="admission-sidebar">
            <div class="sidebar-card">
              <h4>📞 招生咨询</h4>
              <ul class="contact-list">
                <li><span class="contact-icon">🕘</span><div><strong>咨询时间</strong><p data-site-hours></p></div></li>
                <li><span class="contact-icon">📞</span><div><strong>咨询电话</strong><p data-site-phone></p></div></li>
              </ul>
            </div>
            <div class="sidebar-card">
              <h4>📍 学校地址</h4>
              <p style="color:var(--text-secondary);font-size:14px;line-height:1.7;margin-bottom:16px;" data-site-address></p>
              <div class="map-placeholder">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
                </svg>
                <span data-site-name></span>
              </div>
            </div>
            <div class="sidebar-card sidebar-card-cta">
              <h4>💡 温馨提示</h4>
              <p style="color:var(--text-secondary);font-size:14px;line-height:1.7;margin:0;">填报志愿前请仔细阅读招生简章，具体政策以教育主管部门和学校最新通知为准。</p>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <section class="process-section">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Admission Process</span>
          <h2>报名<span class="accent">流程</span></h2>
          <p class="section-subtitle">清晰四步 · 从容准备</p>
        </div>
        <div class="process-timeline">
          <div class="process-step"><div class="process-num">01</div><div class="process-content"><h4>阅读简章</h4><p>了解招生计划、报名条件与时间安排</p></div></div>
          <div class="process-line"></div>
          <div class="process-step"><div class="process-num">02</div><div class="process-content"><h4>填报志愿</h4><p>按照本市中考志愿填报统一安排进行</p></div></div>
          <div class="process-line"></div>
          <div class="process-step"><div class="process-num">03</div><div class="process-content"><h4>参加录取</h4><p>关注录取结果与学校发布的通知</p></div></div>
          <div class="process-line"></div>
          <div class="process-step"><div class="process-num">04</div><div class="process-content"><h4>报到入学</h4><p>按通知时间到校报到，办理入学手续</p></div></div>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <div data-site-modals></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/mailbox.js"></script>
  <script src="assets/js/chat.js"></script>
</body>
</html>
