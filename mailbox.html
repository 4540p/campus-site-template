<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校长信箱 - 青禾中学</title>
  <meta name="description" content="向青禾中学提交咨询、建议、投诉或举报，并查询回复。">
  <meta name="theme-color" content="#1e40af">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/faq.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body data-page="mailbox">
  <a href="#main" class="skip-link">跳到主要内容</a>
  <div data-site-header></div>
  <main id="main" role="main">
    <section class="page-hero page-hero-short">
      <div class="page-hero-bg">
        <div class="page-hero-orb page-hero-orb-1"></div>
        <div class="page-hero-orb page-hero-orb-2"></div>
      </div>
      <div class="container">
        <div class="page-hero-content">
          <div class="page-hero-badge"><span class="page-hero-badge-dot"></span><span data-page-badge></span></div>
          <h1 data-page-title></h1>
          <p class="page-hero-subtitle" data-page-subtitle></p>
          <p class="page-hero-desc" data-page-desc></p>
        </div>
      </div>
    </section>

    <section class="mailbox">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Get In Touch</span>
          <h2>欢迎您的<span class="accent">留言</span></h2>
          <p class="section-subtitle">每一条建议，我们都会认真对待</p>
        </div>

        <div class="mailbox-grid">
          <div class="mailbox-info-card">
            <div id="mailbox-intro"></div>
            <div class="mailbox-features">
              <div class="mailbox-feature">
                <div class="mailbox-feature-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <div><h5>匿名可选</h5><p>支持匿名留言 · 保护隐私</p></div>
              </div>
              <div class="mailbox-feature">
                <div class="mailbox-feature-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
                </div>
                <div><h5>查询码</h5><p>提交后生成 · 随时查询</p></div>
              </div>
              <div class="mailbox-feature">
                <div class="mailbox-feature-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                </div>
                <div><h5>隐私保护</h5><p>联系方式仅管理员可见</p></div>
              </div>
            </div>
            <div class="mailbox-tip"><span class="tip-icon">💡</span><div>提交留言后请保存查询码。学校回复后，可凭查询码在首页或本页查询。</div></div>
            <p class="mailbox-mode-note" id="mailbox-mode-note"></p>
          </div>

          <div class="mailbox-form-card">
            <h3>提交留言</h3>
            <form id="mailbox-form">
              <div class="form-group">
                <label>留言类型 <span class="required">*</span></label>
                <div class="type-options" id="mailbox-types" role="radiogroup" aria-label="留言类型"></div>
              </div>
              <div class="form-group">
                <label for="mailbox-name">姓名 <span class="optional">（匿名可不填）</span></label>
                <input type="text" id="mailbox-name" name="name" placeholder="怎么称呼你？" maxlength="50">
              </div>
              <div class="form-group">
                <label for="mailbox-contact">联系方式 <span class="optional">（匿名可不填）</span></label>
                <input type="text" id="mailbox-contact" name="contact" placeholder="邮箱或电话（用于接收回复）" maxlength="100">
              </div>
              <div class="form-group">
                <label for="mailbox-content">留言内容 <span class="required">*</span></label>
                <textarea id="mailbox-content" name="content" rows="6" placeholder="请描述你的问题、建议或想法（至少 5 个字）" maxlength="2000" required></textarea>
              </div>
              <div class="form-group form-group-checkbox">
                <label class="checkbox-label">
                  <input type="checkbox" id="mailbox-anonymous" name="anonymous">
                  <span class="checkbox-custom"></span>
                  <span>匿名提交 <small style="color:#94a3b8;">（不留姓名，仅能看到留言内容）</small></span>
                </label>
              </div>
              <div class="form-submit">
                <button type="submit" class="hero-btn hero-btn-primary" style="width:100%;justify-content:center;"><span>提交留言</span></button>
              </div>
              <div id="result-message" class="mailbox-form-message"></div>
            </form>
          </div>
        </div>

        <div class="mailbox-history">
          <div class="section-header">
            <span class="section-tag">My Records</span>
            <h2>我的<span class="accent">查询记录</span></h2>
            <p class="section-subtitle">查看本浏览器提交过的留言</p>
          </div>
          <div id="history-result"></div>
          <div id="history-list" class="history-list"></div>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <div data-site-modals></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/mailbox.js"></script>
  <script src="assets/js/chat.js"></script>
</body>
</html>
